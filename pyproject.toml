[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "logisql-agent"
version = "0.2.0"
description = "Enterprise supply-chain text-to-SQL analytics agent with LangGraph, Groq, SQLGlot, and Supabase/PostgreSQL."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "See LICENSE" }
authors = [{ name = "Sarthak Dixit" }]
keywords = ["text-to-sql", "langgraph", "groq", "supabase", "olist", "analytics"]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy[asyncio]>=2.0.35,<2.1",
  "psycopg[binary]>=3.2,<4.0",
  "aiosqlite>=0.20,<1.0",
  "sqlglot>=25.0,<30.0",
  "langgraph>=0.2.60,<2.0",
  "langchain-core>=0.3,<2.0",
  "langchain-groq>=0.2,<2.0",
  "langsmith>=0.1.147,<1.0",
  "pandas>=2.2,<3.1",
  "plotly>=5.24,<7.0",
  "streamlit>=1.40,<2.0",
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "ruff>=0.8,<1.0",
]
ingest = [
  "pandas>=2.2,<3.1",
  "psycopg[binary]>=3.2,<4.0",
]

[project.scripts]
logisql-load = "logisql.ingest.loader:main"
logisql-seed = "logisql.db.seed:main"

[tool.hatch.build.targets.wheel]
packages = ["src/logisql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore::DeprecationWarning:plotly.*",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "apps", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"apps/*" = ["E402"]
